name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-ci:
    name: Server CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carebridge
        run: npx prisma generate
        working-directory: server

      - name: Check syntax
        run: node --check src/index.js
        working-directory: server

  client-ci:
    name: Client CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build React app
        env:
          VITE_API_URL: http://localhost:5001/api
        run: npm run build
        working-directory: client

      - name: Confirm build output
        run: ls client/dist/index.html

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [server-ci, client-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        run: |
          docker build \
            --build-arg DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder \
            -t carebridge-server \
            ./server

      - name: Build client image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:5001/api \
            -t carebridge-client \
            ./client
